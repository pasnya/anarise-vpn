name: Build Android Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload to (for example v1.4.16)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Validate release tag and Android version
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        tag="$RELEASE_TAG"
        if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid release tag: $tag"
          exit 1
        fi
        expected="${tag#v}"
        actual=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)
        if [ "$actual" != "$expected" ]; then
          echo "::error::Release tag $tag does not match Android versionName $actual."
          exit 1
        fi

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Configure and validate Android release signing
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANARISE_KEYSTORE_BASE64 }}
        ANARISE_STORE_PASSWORD: ${{ secrets.ANARISE_STORE_PASSWORD }}
        ANARISE_KEY_ALIAS: ${{ secrets.ANARISE_KEY_ALIAS }}
        ANARISE_KEY_PASSWORD: ${{ secrets.ANARISE_KEY_PASSWORD }}
      run: |
        for name in ANDROID_KEYSTORE_BASE64 ANARISE_STORE_PASSWORD ANARISE_KEY_ALIAS ANARISE_KEY_PASSWORD; do
          if [ -z "${!name}" ]; then
            echo "::error::Required Android signing secret $name is missing."
            exit 1
          fi
        done
        keystore_path="$RUNNER_TEMP/anarise-release.p12"
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
        actual_fingerprint=$(keytool -list -v -keystore "$keystore_path" -storetype PKCS12 -alias "$ANARISE_KEY_ALIAS" -storepass:env ANARISE_STORE_PASSWORD | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
        expected_fingerprint="49D226AA32046EFF916D3DF07F820EE9F95A4AB0DA60B57D05A8B3E6BDB7E6FB"
        if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
          echo "::error::Android release signing certificate changed or is invalid."
          exit 1
        fi
        echo "ANARISE_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build signed APK
      working-directory: android
      env:
        ANARISE_STORE_PASSWORD: ${{ secrets.ANARISE_STORE_PASSWORD }}
        ANARISE_KEY_ALIAS: ${{ secrets.ANARISE_KEY_ALIAS }}
        ANARISE_KEY_PASSWORD: ${{ secrets.ANARISE_KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease

    - name: Verify APK release certificate
      run: |
        sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
        if [ -z "$sdk_root" ] || [ ! -d "$sdk_root/build-tools" ]; then
          echo "::error::Android SDK build-tools were not found."
          exit 1
        fi
        apksigner=$(find "$sdk_root/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
        if [ -z "$apksigner" ]; then
          echo "::error::apksigner was not found in Android SDK build-tools."
          exit 1
        fi
        apk="android/app/build/outputs/apk/release/app-release.apk"
        actual_fingerprint=$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr '[:lower:]' '[:upper:]')
        expected_fingerprint="49D226AA32046EFF916D3DF07F820EE9F95A4AB0DA60B57D05A8B3E6BDB7E6FB"
        if [ "$actual_fingerprint" != "$expected_fingerprint" ]; then
          echo "::error::Built APK is not signed with the pinned Android release certificate."
          exit 1
        fi

    - name: Upload signed APK to Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        tag="$RELEASE_TAG"
        if [ -z "$tag" ]; then
          tag="$GITHUB_REF_NAME"
        fi
        asset="AnariseVPN-Android-arm64-${tag}.apk"
        cp android/app/build/outputs/apk/release/app-release.apk "$asset"
        release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n 1)
        if [ -z "$release_id" ]; then
          echo "::error::Release '$tag' does not exist."
          exit 1
        fi
        asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq ".[] | select(.name == \"$asset\") | .id" | head -n 1)
        if [ -n "$asset_id" ]; then
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
        fi
        curl --fail --silent --show-error --location --request POST \
          --header "Accept: application/vnd.github+json" \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          --header "Content-Type: application/octet-stream" \
          --data-binary "@$asset" \
          "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset" >/dev/null
