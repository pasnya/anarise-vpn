name: Build Android Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload to (for example v1.4.16)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Validate release tag and Android version
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        tag="$RELEASE_TAG"
        if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid release tag: $tag"
          exit 1
        fi
        expected="${tag#v}"
        actual=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' android/app/build.gradle.kts | head -n 1)
        if [ "$actual" != "$expected" ]; then
          echo "::error::Release tag $tag does not match Android versionName $actual."
          exit 1
        fi

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Configure Android release signing
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANARISE_KEYSTORE_BASE64 }}
        ANARISE_STORE_PASSWORD: ${{ secrets.ANARISE_STORE_PASSWORD }}
        ANARISE_KEY_ALIAS: ${{ secrets.ANARISE_KEY_ALIAS }}
        ANARISE_KEY_PASSWORD: ${{ secrets.ANARISE_KEY_PASSWORD }}
      run: |
        if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANARISE_STORE_PASSWORD" ] && [ -n "$ANARISE_KEY_ALIAS" ] && [ -n "$ANARISE_KEY_PASSWORD" ]; then
          keystore_path="$RUNNER_TEMP/anarise-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          echo "ANARISE_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"
          echo "HAS_SIGNING_SECRETS=true" >> "$GITHUB_ENV"
        else
          echo "::notice::Signing secrets not configured; falling back to assembleDebug."
          echo "HAS_SIGNING_SECRETS=false" >> "$GITHUB_ENV"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x android/gradlew

    - name: Build APK
      working-directory: android
      env:
        ANARISE_STORE_PASSWORD: ${{ secrets.ANARISE_STORE_PASSWORD }}
        ANARISE_KEY_ALIAS: ${{ secrets.ANARISE_KEY_ALIAS }}
        ANARISE_KEY_PASSWORD: ${{ secrets.ANARISE_KEY_PASSWORD }}
      run: |
        if [ "$HAS_SIGNING_SECRETS" = "true" ]; then
          ./gradlew assembleRelease
        else
          ./gradlew assembleDebug
        fi

    - name: Upload signed APK to Release
      if: env.HAS_SIGNING_SECRETS == 'true'
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        tag="$RELEASE_TAG"
        if [ -z "$tag" ]; then
          tag="$GITHUB_REF_NAME"
        fi
        asset="AnariseVPN-Android-arm64-${tag}.apk"
        cp android/app/build/outputs/apk/release/app-release.apk "$asset"
        release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n 1)
        if [ -z "$release_id" ]; then
          echo "::error::Release '$tag' does not exist."
          exit 1
        fi
        asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq ".[] | select(.name == \"$asset\") | .id" | head -n 1)
        if [ -n "$asset_id" ]; then
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
        fi
        curl --fail --silent --show-error --location --request POST \
          --header "Accept: application/vnd.github+json" \
          --header "Authorization: Bearer $GH_TOKEN" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          --header "Content-Type: application/octet-stream" \
          --data-binary "@$asset" \
          "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset" >/dev/null

    - name: Prepare unsigned debug APK artifact
      if: env.HAS_SIGNING_SECRETS != 'true'
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        tag="$RELEASE_TAG"
        if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
        cp android/app/build/outputs/apk/debug/app-debug.apk "AnariseVPN-Android-debug-${tag}.apk"

    - name: Store unsigned debug APK as workflow artifact
      if: env.HAS_SIGNING_SECRETS != 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AnariseVPN-Android-debug-${{ inputs.tag || github.ref_name }}
        path: AnariseVPN-Android-debug-*.apk
        retention-days: 14

    - name: Explain unsigned Android build
      if: env.HAS_SIGNING_SECRETS != 'true'
      run: echo "No signed Android APK was added to the public release. The debug build is available as a temporary Actions artifact."
