name: Build Windows Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload to (for example v1.4.15)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Validate release tag and Windows version
      shell: pwsh
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        $tag = $env:RELEASE_TAG
        if ([string]::IsNullOrWhiteSpace($tag)) { $tag = $env:GITHUB_REF_NAME }
        if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid release tag '$tag'." }
        $expected = $tag.Substring(1)
        $source = Get-Content windows/MainWindow.xaml.cs -Raw
        if ($source -notmatch 'AppVersion\s*=\s*"([^"]+)"') { throw "Windows AppVersion was not found." }
        if ($Matches[1] -ne $expected) { throw "Release tag $tag does not match Windows AppVersion $($Matches[1])." }

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Windows Client
      run: |
        dotnet publish windows/Anarise.csproj -c Release -r win-x64 --self-contained false -o publish

    - name: Zip Artifact
      shell: pwsh
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        $tag = $env:RELEASE_TAG
        if ([string]::IsNullOrEmpty($tag)) {
          $tag = $env:GITHUB_REF_NAME
        }
        Compress-Archive -Path publish\* -DestinationPath "AnariseVPN-Windows-x64-$tag.zip" -Force

    - name: Upload to Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        $tag = $env:RELEASE_TAG
        if ([string]::IsNullOrEmpty($tag)) {
          $tag = $env:GITHUB_REF_NAME
        }
        $releaseQuery = '.[] | select(.tag_name == "' + $tag + '") | .id'
        $releaseId = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq $releaseQuery | Select-Object -First 1
        if ([string]::IsNullOrWhiteSpace($releaseId)) { throw "Release '$tag' does not exist." }
        $asset = "AnariseVPN-Windows-x64-$tag.zip"
        $assetQuery = '.[] | select(.name == "' + $asset + '") | .id'
        $assetIds = gh api "repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets" --paginate --jq $assetQuery
        foreach ($assetId in $assetIds) {
          gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/assets/$assetId" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not remove old asset '$asset'." }
        }
        curl.exe --fail --silent --show-error --location --request POST `
          --header "Accept: application/vnd.github+json" `
          --header "Authorization: Bearer $env:GH_TOKEN" `
          --header "X-GitHub-Api-Version: 2022-11-28" `
          --header "Content-Type: application/octet-stream" `
          --data-binary "@$asset" `
          "https://uploads.github.com/repos/$env:GITHUB_REPOSITORY/releases/$releaseId/assets?name=$asset" | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "Could not upload asset '$asset'." }
