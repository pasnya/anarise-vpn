name: Build Windows Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload to (for example v1.4.15)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish Windows Client
      run: |
        dotnet publish windows/Anarise.csproj -c Release -r win-x64 --self-contained false -o publish

    - name: Zip Artifact
      shell: pwsh
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        $tag = $env:RELEASE_TAG
        if ([string]::IsNullOrEmpty($tag)) {
          $tag = $env:GITHUB_REF_NAME
        }
        Compress-Archive -Path publish\* -DestinationPath "AnariseVPN-Windows-x64-$tag.zip" -Force

    - name: Upload to Release
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        $tag = $env:RELEASE_TAG
        if ([string]::IsNullOrEmpty($tag)) {
          $tag = $env:GITHUB_REF_NAME
        }
        gh release view $tag | Out-Null
        if ($LASTEXITCODE -ne 0) {
          throw "Release '$tag' does not exist."
        }
        gh release upload $tag "AnariseVPN-Windows-x64-$tag.zip" --clobber
