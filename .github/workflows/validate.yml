name: Validate Clients

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  windows:
    name: Windows build and parser smoke tests
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build Windows client
        run: dotnet build windows/Anarise.csproj --configuration Release --nologo

      - name: Run parser smoke tests
        run: dotnet run --project tests/LinkParserHarness/LinkParserHarness.csproj --configuration Release -- --smoke

      - name: Validate trusted binary manifest
        run: dotnet run --project tests/LinkParserHarness/LinkParserHarness.csproj --configuration Release -- --validate-manifest

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
