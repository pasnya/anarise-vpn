name: Build macOS Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to upload to (for example v1.4.16)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: Validate release tag and macOS version
      env:
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        tag="$RELEASE_TAG"
        if [ -z "$tag" ]; then tag="$GITHUB_REF_NAME"; fi
        if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::Invalid release tag: $tag"
          exit 1
        fi
        expected="${tag#v}"
        actual=$(sed -nE 's/.*AppVersion = "([^"]+)".*/\1/p' macos/Program.cs | head -n 1)
        if [ "$actual" != "$expected" ]; then
          echo "::error::Release tag $tag does not match macOS AppVersion $actual."
          exit 1
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Build and Package macOS arm64 (Apple Silicon - DMG and ZIP)
      run: |
        tag="${{ inputs.tag }}"
        if [ -z "$tag" ]; then
          tag="$GITHUB_REF_NAME"
        fi
        sed -i '' 's/\r$//' macos/build-macos.sh
        chmod +x macos/build-macos.sh
        ./macos/build-macos.sh osx-arm64
        cp "macos/AnariseVPN-macOS-osx-arm64.dmg" "AnariseVPN-macOS-arm64-$tag.dmg"
        ditto -c -k --sequesterRsrc --keepParent macos/Anarise.app "AnariseVPN-macOS-arm64-$tag.zip"

    - name: Build and Package macOS x64 (Intel - DMG and ZIP)
      run: |
        tag="${{ inputs.tag }}"
        if [ -z "$tag" ]; then
          tag="$GITHUB_REF_NAME"
        fi
        ./macos/build-macos.sh osx-x64
        cp "macos/AnariseVPN-macOS-osx-x64.dmg" "AnariseVPN-macOS-x64-$tag.dmg"
        ditto -c -k --sequesterRsrc --keepParent macos/Anarise.app "AnariseVPN-macOS-x64-$tag.zip"

    - name: Upload to Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_TAG: ${{ inputs.tag }}
      run: |
        tag="$RELEASE_TAG"
        if [ -z "$tag" ]; then
          tag="$GITHUB_REF_NAME"
        fi
        release_id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n 1)
        if [ -z "$release_id" ]; then
          echo "::error::Release '$tag' does not exist."
          exit 1
        fi
        for asset in \
          "AnariseVPN-macOS-arm64-$tag.dmg" \
          "AnariseVPN-macOS-x64-$tag.dmg" \
          "AnariseVPN-macOS-arm64-$tag.zip" \
          "AnariseVPN-macOS-x64-$tag.zip"; do
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate --jq ".[] | select(.name == \"$asset\") | .id" | head -n 1)
          if [ -n "$asset_id" ]; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" >/dev/null
          fi
          curl --fail --silent --show-error --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/octet-stream" \
            --data-binary "@$asset" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$release_id/assets?name=$asset" >/dev/null
        done
